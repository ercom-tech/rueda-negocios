<!doctype html>
<html lang="es">
<head>
  <title>Algo falló de este lado · Rueda de Negocios</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: #101010; color: #f4eedb; padding: 1.5rem;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 26rem; background: #edc94c; color: #171717;
      border-radius: 1.75rem; padding: 2.5rem 2rem;
    }
    .badge {
      display: inline-block; background: #000; color: #fff;
      border-radius: 1rem; padding: .75rem 1.5rem;
      font-size: 1.25rem; font-weight: 800; margin-bottom: 1.25rem;
    }
    p { line-height: 1.55; margin-top: .75rem; }
    .action {
      display: inline-block; margin-top: 1.5rem; background: #bd5343; color: #fff;
      border-radius: 999px; padding: .7rem 1.6rem; font-weight: 700; text-decoration: none;
    }
    .hint { font-size: .9rem; color: #3d3315; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Algo falló de este lado</span>
    <p>La aplicación no pudo terminar lo que le pediste. Tu pedido no se perdió: lo que hayas guardado sigue en esta laptop.</p>
    <p><strong>Vuelve al menú e inténtalo de nuevo. Si vuelve a pasar, avísale al equipo del servidor.</strong></p>
    <a class="action" href="/">Ir al menú</a>
    <p class="hint">Rueda de Negocios · FECEGO</p>
  </main>
</body>
</html>
