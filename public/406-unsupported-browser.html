<!doctype html>
<html lang="es">
<head>
  <title>Navegador no compatible · Rueda de Negocios</title>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: #101010; color: #f4eedb; padding: 1.5rem;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 26rem; background: #edc94c; color: #171717;
      border-radius: 1.75rem; padding: 2.5rem 2rem;
    }
    .badge {
      display: inline-block; background: #000; color: #fff;
      border-radius: 1rem; padding: .75rem 1.5rem;
      font-size: 1.25rem; font-weight: 800; margin-bottom: 1.25rem;
    }
    p { line-height: 1.55; margin-top: .75rem; }
    .hint { font-size: .9rem; color: #3d3315; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Navegador no compatible</span>
    <p>Esta aplicación necesita un navegador actualizado y este equipo tiene uno
       muy antiguo.</p>
    <p><strong>Abre esta misma dirección en Chrome, Edge, Firefox o Safari
       reciente</strong>, o pide apoyo al equipo del servidor para usar otro
       equipo.</p>
    <p class="hint">Rueda de Negocios · FECEGO</p>
  </main>
</body>
</html>
